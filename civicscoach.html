<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicsCoach — Подготовка к тесту на гражданство США</title>
<style>
  :root{
    --bg:#f7f8fb; --surface:#ffffff; --surface-2:#eef1f7;
    --text:#1c2130; --text-dim:#5b6272; --border:#e2e5ec;
    --primary:#2f5fd8; --primary-dim:#e8edfc;
    --good:#1a8a5f; --good-bg:#e5f6ee;
    --warn:#b3760a; --warn-bg:#fbeed7;
    --bad:#c23b3b; --bad-bg:#fbe6e6;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,24,40,.06), 0 4px 14px rgba(20,24,40,.06);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c; --surface:#1c1f28; --surface-2:#242833;
      --text:#e9ebf1; --text-dim:#a2a7b5; --border:#2c3040;
      --primary:#7fa0f5; --primary-dim:#232c47;
      --good:#5fd6a4; --good-bg:#173427;
      --warn:#f0c169; --warn-bg:#3a2e14;
      --bad:#f28b8b; --bad-bg:#3a1c1c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;}
  .app{max-width:720px;margin:0 auto;padding:16px 16px 90px;}
  .site-backbar{max-width:720px;margin:0 auto;padding:10px 16px 0;}
  .site-backbar a{color:var(--text-dim);font-size:13px;text-decoration:none;}
  .site-backbar a:hover{color:var(--primary);text-decoration:underline;}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px;}
  header.top h1{font-size:17px;margin:0;font-weight:700;}
  .lang-toggle{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
  .lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .lang-toggle button.active{background:var(--primary);color:#fff;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:26px;font-weight:800;color:var(--primary);}
  .stat .lbl{font-size:12px;color:var(--text-dim);margin-top:2px;}

  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring{width:84px;height:84px;flex-shrink:0;}
  .ring-label{font-size:13px;color:var(--text-dim);}
  .ring-label b{display:block;font-size:20px;color:var(--text);font-weight:800;}

  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .menu button.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;}
  .menu button.tile .emoji{font-size:22px;}
  .menu button.tile .t{font-weight:700;font-size:14px;margin-top:6px;}
  .menu button.tile .d{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.3;}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:20;}
  nav.tabs .inner{max-width:720px;width:100%;display:flex;}
  nav.tabs button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:10.5px;color:var(--text-dim);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--primary);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.secondary{background:var(--surface-2);color:var(--text);}
  .btn.ghost{background:transparent;color:var(--primary);padding:8px 10px;}
  .btn.good{background:var(--good);}
  .btn.bad{background:var(--bad);}
  .btn:disabled{opacity:.45;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row.between{justify-content:space-between;align-items:center;}

  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .backbar button{background:none;border:none;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;font-family:inherit;}
  .backbar h2{font-size:16px;margin:0;}

  .progressbar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .progressbar > div{height:100%;background:var(--primary);border-radius:6px;transition:width .3s;}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .badge.new{background:var(--surface-2);color:var(--text-dim);}
  .badge.good{background:var(--good-bg);color:var(--good);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}

  .flash{min-height:260px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;user-select:none;}
  .flash .qnum{font-size:12px;color:var(--text-dim);font-weight:700;}
  .flash .qtext{font-size:19px;font-weight:700;line-height:1.4;margin:14px 0;}
  .flash .qtext-ru{font-size:14px;color:var(--text-dim);font-weight:500;margin-top:6px;}
  .flash .ans{border-top:1px dashed var(--border);padding-top:12px;margin-top:8px;}
  .flash .ans ul{margin:6px 0 0;padding-left:18px;}
  .flash .ans li{margin-bottom:4px;font-size:15px;}
  .flash .ans-ru{color:var(--text-dim);font-size:13px;}
  .flash .hint{text-align:center;font-size:12px;color:var(--text-dim);}
  .speak-btn{background:var(--surface-2);border:none;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:14px;}

  .quiz-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;font-family:inherit;color:var(--text);}
  .quiz-opt.correct{border-color:var(--good);background:var(--good-bg);}
  .quiz-opt.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .quiz-opt:disabled{cursor:default;}

  select,input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;margin-top:5px;}
  label.field{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin-top:14px;}
  .field-hint{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.4;}

  .catbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .catbar .name{font-size:13.5px;font-weight:700;}
  .catbar .pct{font-size:12px;color:var(--text-dim);}

  .empty{text-align:center;padding:40px 10px;color:var(--text-dim);}
  .empty .big{font-size:34px;margin-bottom:10px;}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:var(--shadow);}

  h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:20px 0 8px;}
  p.lead{color:var(--text-dim);font-size:13.5px;line-height:1.5;margin-top:0;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  a{color:var(--primary);}
</style>
</head>
<body>
<div class="site-backbar"><a href="civicscoach-project.html">&larr; katrindesign.com</a></div>

  <div class="inner">
    <button data-tab="dashboard" class="tabbtn"><span class="ic">🏠</span>Главная</button>

    <button data-tab="quiz" class="tabbtn"><span class="ic">✅</span>Квиз</button>
    <button data-tab="mock" class="tabbtn"><span class="ic">🎤</span>Интервью</button>
    <button data-tab="settings" class="tabbtn"><span class="ic">⚙️</span>Настройки</button>
  </div>
</nav>

ow are changes made to the U.S. Constitution?", "en_a": ["Amendments", "The amendment process"], "ru_q": "Как вносятся изменения в Конституцию США?", "ru_a": ["Через поправки", "Через процесс внесения поправок"]}, {"id": 6, "section": "government", "subsection": "Principles of American Government", "exempt6520": false, "personalized": null, "en_q": "What does the Bill of Rights protect?", "en_a": ["(The basic) rights of Americans", "(The basic) rights of people living in the United States"], "ru_q": "Что защищает Билль о правах?", "ru_a": ["Основные права американцев", "Основные права людей, живущих в США"]}, {"id": 7, "section": "government", "subsection": "Principles of American Government", "exempt6520": true, "personalized": null, "en_q": "How many amendments does the U.S. Constitution have?", "en_a": ["Twenty-seven (27)"], "ru_q": "Сколько поправок в Конституции США?", "ru_a": ["Двадцать семь (27)"]}, {"id": 8, "section": "government", "subsection": "Principles of American Government", "exempt6520": false, "personalized": null, "en_q": "Why is the Declaration of Independence important?", "en_a": ["It says America is free from British control.", "It says all people are created equal.", "It identifies inherent rights.", "It identifies individual freedoms."], "ru_q": "Почему важна Декларация независимости?", "ru_a": ["Она провозглашает независимость Америки от Британии", "Она провозглашает равенство всех людей", "Она определяет неотъемлемые права", "Она определяет личные свободы"]}, {"id": 9, "section": "government", "subsection": "Principles of American Government", "exempt6520": false, "personalized": null, "en_q": "What founding document said the American colonies were free from Britain?", "en_a": ["Declaration of Independence"], "ru_q": "Какой основополагающий документ провозгласил независимость американских колоний от Британии?", "ru_a": ["Декларация независимости"]}, {"id": 10, "section": "government", "subsection": "Principles of American Government", "exem ralist Papers", "Virginia Declaration of Rights", "Fundamental Orders of Connecticut", "Mayflower Compact", "Iroquois Great Law of Peace"], "ru_q": "Многие документы повлияли на Конституцию США. Назовите один.", "ru_a": ["Декларация независимости", "Статьи Конфедерации", "«Записки федералиста»", "«Записки антифедералиста»", "Виргинская декларация прав", "Основные законы Коннектикута", "Мэйфлауэрское соглашение", "Великий закон мира ирокезов"]}, {"id": 15, "section": "government", "subsection": "Principles of American Government", "exempt6520": false, "personalized": null, "en_q": "There are three branches of government. Why?", "en_a": ["So one part does not become too powerful", "Checks and balances", "Separation of powers"], "ru_q": "В США три ветви власти. Почему?", "ru_a": ["Чтобы ни одна из них не стала слишком сильной", "Система сдержек и противовесов", "Разделение властей"]}, {"id": 16, "section": "government", "subsection": "System of Government", "exempt6520": false, "personalized": null, "en_q": "Name the three branches of government.", "en_a": ["Legislative, executive, and judicial", "Congress, president, and the courts"], "ru_q": "Назовите три ветви власти.", "ru_a": ["Законодательная, исполнительная и судебная", "Конгресс, президент и суды"]}, {"id": 17, "section": "government", "subsection": "System of Government", "exempt6520": false, "personalized": null, "en_q": "The President of the United States is in charge of which branch of government?", "en_a": ["Executive branch"], "ru_q": "Какую ветвь власти возглавляет президент США?", "ru_a": ["Исполнительную власть"]}, {"id": 18, "section": "government", "subsection": "System of Government", "exempt6520": false, "personalized": null, "en_q": "What part of the federal government writes laws?", "en_a": ["(U.S.) Congress", "(U.S. or national) legislature", "Legislative branch"], "ru_q": "Какая часть федерального правительства пишет законы?", "ru_a": ["Конгресс США", "Законодательная власть"]}, {"id": 19, "sec /* ---------- STATE (in-memory only, no localStorage) ---------- */
const state = {
  lang: 'both', // 'en' | 'both'
  tab: 'dashboard',
  screen: null, // sub-screen override, e.g. 'flash-session'
  progress: {}, // id -> {seen, correct, wrong, lastResult, history:[{date,result}]}
  personalization: {
    stateName: '', capital: '', senator1:'', senator2:'', representative:'', governor:'',
    president:'Donald Trump', vicepresident:'JD Vance', speaker:'Mike Johnson', chiefjustice:'John Roberts'
  },
  session: null, // active flashcard/quiz/mock session data
  streak: 0,
  lastActiveDate: null,
};

function ensureProgress(id){
  if(!state.progress[id]) state.progress[id] = {seen:0, correct:0, wrong:0, lastResult:null, history:[]};
  return state.progress[id];
}

function recordResult(id, ok){
  const p = ensureProgress(id);
  p.seen++;
  if(ok){ p.correct++; } else { p.wrong++; }
  p.lastResult = ok ? 'good' : 'bad';
  p.history.push({t: Date.now(), ok});
  if(p.history.length>20) p.history.shift();
  touchStreak();
}

function touchStreak(){
  const today = new Date().toDateString();
  if(state.lastActiveDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.streak = (state.lastActiveDate === y.toDateString()) ? state.streak+1 : 1;
    state.lastActiveDate = today;
  }
}

function masteryOf(id){
  const p = state.progress[id];
  if(!p || p.seen===0) return 'new';
  if(p.lastResult==='good' && p.correct >= p.wrong+1) return 'good';
  if(p.lastResult==='bad') return 'bad';
  return 'warn';
}

function overallStats(){
  let mastered=0, learning=0, unseen=0;
  QUESTIONS.forEach(q=>{
    const m = masteryOf(q.id);
    if(m==='new') unseen++;
    else if(m==='good') mastered++;
    else learning++;
  });
  return {mastered, learning, unseen, total: QUESTIONS.length};
}

function categoryStats(){
  const cats = {};
  QUESTIONS.forEach(q=>{
    cats[q.subsection] = cats[q.subsection] || {total:0, mastered:0};
    cats[q.subsection].total++;
    if(masteryOf(q.id)==='good') cats[q.subsection].mastered++;
  });
  return cats;
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.getElementById('toast-holder').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function speak(text){
  if(!('speechSynthesis' in window)) { toast('Озвучка не поддерживается в этом браузере'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.92;
  window.speechSynthesis.speak(u);
}

/* ---------- voice answer (speech recognition) ---------- */
function hasSpeechRecognition(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
const STOPWORDS = new Set(['the','a','an','of','to','in','is','are','and','or','for','by','at','on','with','as','that','this','it','its','their','they','we','us','people','you','your']);
function normalizeForMatch(s){
  return String(s).toLowerCase()
    .replace(/[().,!?;:"']/g,' ')
    .replace(/-/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function keywordsOf(s){
  return normalizeForMatch(s).split(' ').filter(w => w.length && (w.length>2 || /^\d+$/.test(w)) && !STOPWORDS.has(w));
}
function answerVariants(answerText){
  const parens = [...String(answerText).matchAll(/\(([^)]*)\)/g)].map(m=>m[1]);
  const stripped = String(answerText).replace(/\([^)]*\)/g,' ');
  return [answerText, stripped, ...parens];
}
function matchScore(transcript, answer){
  const tWords = new Set(normalizeForMatch(transcript).split(' ').filter(Boolean));
  let best = 0;
  answerVariants(answer).forEach(variant=>{
    const kws = keywordsOf(variant);
    if(kws.length===0) return;
    let hit=0;
    kws.forEach(k=>{ if(tWords.has(k)) hit++; });
    const sc = hit/kws.length;
    if(sc>best) best=sc;
  });
  return best;
}
function bestMatch(transcript, answers){
  let best=0;
  answers.forEach(a=>{ const sc = matchScore(transcript,a); if(sc>best) best=sc; });
  return best;
}
function speechErrorText(code){
  const map = {
    'not-allowed':'Доступ к микрофону не разрешён — проверьте настройки браузера.',
    'permission-denied':'Доступ к микрофону не разрешён.',
    'no-speech':'Речь не распознана, попробуйте ещё раз.',
    'audio-capture':'Не найден микрофон.',
    'network':'Для распознавания речи нужен интернет.'
  };
  return map[code] || 'Не удалось распознать речь.';
}
function startListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Голосовой ввод не поддерживается в этом браузере'); return; }
  const sess = state.session;
  if(!sess) return;
  const rec = new SR();
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  sess.listening = true; render();
  rec.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    const q = QUESTIONS.find(x=>x.id===sess.list[sess.idx]);
    sess.heard = transcript;
    sess.heardScore = bestMatch(transcript, q.en_a);
    sess.listening = false;
    sess.flipped = true;
    render();
  };
  rec.onerror = (e)=>{
    sess.listening = false;
    toast(speechErrorText(e.error));
    render();
  };
  rec.onend = ()=>{ if(sess.listening){ sess.listening=false; render(); } };
  try{ rec.start(); }catch(e){ sess.listening=false; toast('Не удалось запустить распознавание речи'); render(); }
}
function personalizedAnswer(q){
  const p = state.personalization;
  if(q.personalized==='senator') return [p.senator1 || '—', p.senator2 || ''].filter(Boolean).join(', ') || null;
  if(q.personalized==='representative') return p.representative || null;
  if(q.personalized==='governor') return p.governor || null;
  if(q.personalized==='capital') return p.capital || null;
  if(q.personalized==='current'){
    if(q.id===30) return p.speaker || null;
    if(q.id===38) return p.president || null;
    if(q.id===39) return p.vicepresident || null;
    if(q.id===57) return p.chiefjustice || null;
  }
  return null;
}

function pickRandom(arr, n){
  const copy = arr.slice();
  for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy.slice(0,n);
}

function buildQuizOptions(q){
  const correct = q.en_a[0];
  const seen = new Set([correct]);
  const distractors = [];
  const sectionPool = pickRandom(QUESTIONS.filter(o=>o.id!==q.id && o.section===q.section), 40);
  for(const o of sectionPool){
    if(distractors.length>=3) break;
    if(!seen.has(o.en_a[0])){ distractors.push(o.en_a[0]); seen.add(o.en_a[0]); }
  }
  if(distractors.length<3){
    const anyPool = pickRandom(QUESTIONS.filter(o=>o.id!==q.id), 60);
    for(const o of anyPool){
      if(distractors.length>=3) break;
      if(!seen.has(o.en_a[0])){ distractors.push(o.en_a[0]); seen.add(o.en_a[0]); }
    }
  }
  return pickRandom([correct, ...distractors], 1+distractors.length);
}

function startQuiz(list){
  if(list.length===0){ toast('Нет вопросов для этого выбора'); return; }
  state.session = { list: list.map(q=>({id:q.id, opts: buildQuizOptions(q), answered:false})), idx:0, correct:0 };

  render();
}

    <input type="text" id="p-cj" value="${esc(p.chiefjustice)}">
    <button class="btn" style="width:100%;margin-top:16px;" data-action="save-personalization">Сохранить</button>
  </div>
  <div class="card">
    <h3 class="sect" style="margin-top:0;">Данные и прогресс</h3>
    <p class="lead">Прогресс живёт только в этой вкладке браузера. Скачайте файл, чтобы не потерять его, и загрузите в следующий раз, когда откроете приложение.</p>
    <div class="row">
      <button class="btn secondary" data-action="export">⬇️ Сохранить прогресс</button>
      <label class="btn secondary" style="cursor:pointer;">⬆️ Загрузить прогресс<input type="file" id="import-file-2" accept="application/json" style="display:none;"></label>
    </div>
    <div style="margin-top:12px;">
      <button class="btn bad" data-action="reset-progress">Сбросить весь прогресс</button>
    </div>
  </div>
  <div class="card">
    <h3 class="sect" style="margin-top:0;">О приложении</h3>
    <p class="lead">128 вопросов версии 2025 civics-теста (M-1778, 09/25), официальный список USCIS. На интервью офицер задаёт до 20 вопросов и останавливается на 12 верных или 9 неверных ответах. Это неофициальный учебный инструмент, не связанный с USCIS.</p>
  </div>`;
}

/* ---------- EVENTS ---------- */
function wireEvents(){
  document.querySelectorAll('.tabbtn').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; state.screen=null; state.session=null; render(); };
  });
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick = ()=>{ state.lang=b.dataset.lang; render(); };
  });
  const app = document.getElementById('app');

  app.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      handleAction(action, el, ev);
    });
  });
  const impFile = document.getElementById('import-file') || document.getElementById('import-file-2');
  if(impFile) impFile.addEventListener('change', handleImport);

  const pState = document.getElementById('p-state');
  if(pState){
    updateCapitalHint();
    pState.addEventListener('change', updateCapitalHint);
  }
}
function updateCapitalHint(){
  const sel = document.getElementById('p-state');
  const hint = document.getElementById('capital-hint');
  if(!sel||!hint) return;
  const s = STATES.find(x=>x.name===sel.value);
  hint.textContent = s ? `Столица штата: ${s.capital}` : '';
}

function handleAction(action, el){
  if(action==='flip'){ if(state.session){ state.session.flipped = !state.session.flipped; render(); } return; }
  if(action==='speak'){ speak(el.dataset.text); return; }
  if(action==='back-home'){ state.screen=null; state.session=null; render(); return; }

  if(action==='start-learn'){
    const unseen = QUESTIONS.filter(q=>!(state.progress[q.id]&&state.progress[q.id].seen>0));
    startFlashSession(pickRandom(unseen, Math.min(10, unseen.length)).sort((a,b)=>a.id-b.id), 'learn');
    return;
  }
  if(action==='start-review'){
    const weak = QUESTIONS.filter(q=>['bad','warn'].includes(masteryOf(q.id)));
    startFlashSession(weak, 'review');
    return;
  }
  if(action==='start-mock' || action==='mock-start'){
    state.session = { list: pickRandom(QUESTIONS, QUESTIONS.length).map(q=>q.id), idx:0, correct:0, wrong:0, flipped:false, heard:null, heardScore:0, listening:false };
    state.screen='mock-session'; render(); return;
  }
  if(action==='mock-listen'){ startListening(); return; }
  if(action==='start-quiz-all'){ startQuiz(QUESTIONS); return; }
  if(action==='flash-all'){ startFlashSession(QUESTIONS, 'all'); return; }
  if(action==='flash-new'){
    const unseen = QUESTIONS.filter(q=>!(state.progress[q.id]&&state.progress[q.id].seen>0));
    startFlashSession(unseen, 'new'); return;
  }
  if(action==='flash-cat'){ startFlashSession(QUESTIONS.filter(q=>q.subsection===el.dataset.cat), 'cat'); return; }
  if(action==='flash-grade'){
    const sess = state.session;
    const q = QUESTIONS.find(x=>x.id===sess.list[sess.idx]);
    recordResult(q.id, el.dataset.ok==='1');
    sess.idx++; sess.flipped=false; render(); return;
  }
  if(action==='mock-grade'){
    const sess = state.session;
    const q = QUESTIONS.find(x=>x.id===sess.list[sess.idx]);
    const ok = el.dataset.ok==='1';
    recordResult(q.id, ok);
    if(ok) sess.correct++; else sess.wrong++;
    sess.idx++; sess.flipped=false; sess.heard=null; sess.heardScore=0; sess.listening=false; render(); return;
  }

  if(action==='quiz-start'){
    const n = parseInt(document.getElementById('quiz-count').value,10);
    const cat = document.getElementById('quiz-cat').value;
    let pool = cat ? QUESTIONS.filter(q=>q.subsection===cat) : QUESTIONS;
    startQuiz(pickRandom(pool, Math.min(n, pool.length)));
    return;
  }
  if(action==='quiz-weak'){
    const weak = QUESTIONS.filter(q=>['bad','warn'].includes(masteryOf(q.id)));
    startQuiz(weak); return;
  }
  if(action==='quiz-answer'){
    const sess = state.session;
    const cur = sess.list[sess.idx];
    if(cur.answered) return;
    const q = QUESTIONS.find(x=>x.id===cur.id);
    const picked = cur.opts[parseInt(el.dataset.i,10)];
    cur.picked = picked; cur.answered = true;
    const ok = picked===q.en_a[0];
    if(ok) sess.correct++;
    recordResult(q.id, ok);
    render(); return;
  }
  if(action==='quiz-next'){ state.session.idx++; render(); return; }

  if(action==='save-personalization'){
    const p = state.personalization;
    p.stateName = document.getElementById('p-state').value;
    const s = STATES.find(x=>x.name===p.stateName);
    p.capital = s ? s.capital : '';
    p.senator1 = document.getElementById('p-sen1').value;
    p.senator2 = document.getElementById('p-sen2').value;
    p.representative = document.getElementById('p-rep').value;
    p.governor = document.getElementById('p-gov').value;
    p.president = document.getElementById('p-president').value;
    p.vicepresident = document.getElementById('p-vp').value;
    p.speaker = document.getElementById('p-speaker').value;
    p.chiefjustice = document.getElementById('p-cj').value;
    toast('Сохранено');
    return;
  }
  if(action==='reset-progress'){
    if(confirm('Точно сбросить весь прогресс по вопросам?')){ state.progress = {}; state.streak=0; render(); toast('Прогресс сброшен'); }
    return;
  }
  if(action==='export'){ doExport(); return; }
}

function doExport(){
  const payload = {
    version:1, exportedAt:new Date().toISOString(),
    progress: state.progress, personalization: state.personalization,
    streak: state.streak, lastActiveDate: state.lastActiveDate
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'civics-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Файл прогресса сохранён');
}
function handleImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.progress) state.progress = data.progress;
      if(data.personalization) state.personalization = Object.assign(state.personalization, data.personalization);
      if(typeof data.streak==='number') state.streak = data.streak;
      if(data.lastActiveDate) state.lastActiveDate = data.lastActiveDate;
      toast('Прогресс загружен');
      render();
    }catch(e){ toast('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
}

render();
</script>
</body>
</html>
